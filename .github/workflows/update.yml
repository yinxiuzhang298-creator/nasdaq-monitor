name: Auto Update Prices

on:
  schedule:
    # 每 15 分钟运行一次 (GitHub 免费版的最短合理间隔)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python auto_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add prices.js prices.json
          # 如果有更新才提交，没有就跳过
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update prices" && git push)
# force active
pip install yfinance
